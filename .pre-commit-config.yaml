repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6]
        args: [--strict]
        files: ^src/modelhub/

  - repo: local
    hooks:
      - id: check-no-cheating
        name: check-no-cheating (AST scan)
        entry: python3 scripts/check_no_cheating.py src
        language: system
        pass_filenames: false

      - id: check-placeholders
        name: check-placeholders
        entry: python3 scripts/check_placeholders.py docs src
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
